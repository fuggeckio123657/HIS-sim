  const dx = (p.dx || []).filter(d => d.icd); if (dx.filter(d => d.type === '主要').length !== 1) err('必須有且僅有 1 個主要診斷'); dx.forEach(d => { if (!DB.one('icd10', x => x.code === d.icd)) err('ICD 診斷碼不存在：' + d.icd); }); if (new Set(dx.map(d => d.icd)).size !== dx.length) err('診斷重複');
  const items = CL.buildItems(ap, p, ap.ins), pt = HIS.pt(ap.patient_id), seenIng = {};
  items.filter(i => i.kind === 'drug').forEach(i => { if (seenIng[i.ingredient]) err('重複用藥：' + i.ingredient); seenIng[i.ingredient] = 1; if (i.med.controlled && i.days > 7) err(i.med.name_zh + '為管制藥品，限 7 日內'); const al = HIS.checkAllergy(pt.id, i.med); if (al.length && !i.allergy_override) err('過敏警示：' + al.map(x => x.msg).join('；') + '。若仍要開立請填寫過敏覆核原因'); });
  if (items.some(i => i.kind === 'svc' && i.code === 'CERT') && !items.some(i => i.code === 'CERT')) err('項目錯誤');
  if ((p.refer && (p.refer.to || p.refer.reason)) && !((p.refer.to || '').trim() && (p.refer.reason || '').trim())) err('轉診須填寫轉診院所及原因');
  const when = ctx.when || CL.now(), date = when.slice(0, 10);
  return DB.tx(() => {
    const idx = CL.doctorIdx(u.id, date), enc = DB.insert('encounters', { patient_id: pt.id, type: 'CLINIC', dept_id: 'DEP-FM', doctor_id: u.id, appt_id: apptId, date, start_time: ctx.start || ap.registered_at || when, end_time: when, status: '完診', ins: ap.ins, ic_seq: ap.ic_seq || null, visit_no: idx, primary_icd: dx.find(d => d.type === '主要').icd, refer: p.refer && p.refer.to ? p.refer : null, claim_id: null, disp_status: items.some(i => i.kind === 'drug') ? '待領藥' : '無需領藥', tpl_used: p.tpl_used || '' });
    DB.where('vital_signs', v => v.appt_id === apptId).forEach(v => DB.update('vital_signs', v.id, { encounter_id: enc.id }));
    const rec = DB.insert('medical_records', Object.assign({ patient_id: pt.id, encounter_id: enc.id, type: '診所門診SOAP', status: '已簽署', version: 1, created_at: ap.registered_at || when, created_by: u.id, updated_at: when, updated_by: u.id, signed_by: u.id, signed_at: when }, Object.fromEntries(CL.REC_FIELDS.map(k => [k, (r[k] || '').trim()]))));
    DB.insert('record_versions', Object.assign({ record_id: rec.id, patient_id: pt.id, version: 1, saved_at: when, saved_by: u.id, reason: '完診簽署', status: '已簽署' }, Object.fromEntries(CL.REC_FIELDS.map(k => [k, (r[k] || '').trim()]))));
    dx.forEach(d => { const x = DB.one('icd10', c => c.code === d.icd); DB.insert('diagnoses', { patient_id: pt.id, encounter_id: enc.id, record_id: rec.id, icd_code: x.code, zh: x.zh, en: x.en, type: d.type, status: d.status || '確診', scope: '', date, doctor_id: u.id }); });
    items.forEach(i => { const { med, sv, ...row } = i; DB.insert('cl_items', Object.assign(row, { encounter_id: enc.id, patient_id: pt.id, date, doctor_id: u.id, result_due: i.result_status === '待回報' ? HIS.addDays(date, i.ext_days || 2) : null })); });
    const ch = CL.calc({ ins: ap.ins, exempt: pt.exempt, doctorIdx: idx, items }); const charge = DB.insert('cl_charges', Object.assign({ encounter_id: enc.id, patient_id: pt.id, date, ins: ap.ins, status: '待批價', created_at: when }, ch));
    DB.update('appointments', apptId, { status: '已看診', encounter_id: enc.id }); if (!ctx.seed) HIS.audit('COMPLETE_VISIT', 'encounters', enc.id, `完診 ${enc.primary_icd} 藥${items.filter(i => i.kind === 'drug').length} 項目${items.filter(i => i.kind === 'svc').length} 點數${ch.total_pt}`, pt.id);
    return { encounter: enc, charge };
  });
};

/* ---------- 批價 / 領藥 / 進貨 ---------- */
S.clPay = (encId, o) => {
  need('cl_bill'); const ch = DB.one('cl_charges', { encounter_id: encId }); if (!ch) err('找不到費用'); if (ch.status !== '待批價') err('此就診已批價'); const rec = Number(o.received);
  if (!(rec >= ch.cash_due)) err(`收款不足：應收 ${ch.cash_due} 元`); DB.update('cl_charges', ch.id, { status: '已批價', paid_at: CL.now(), paid_by: me().id, method: o.method || '現金', received: rec, change: rec - ch.cash_due });
  const e = DB.get('encounters', encId); if (e.disp_status === '無需領藥') DB.update('encounters', encId, { disp_status: '無需領藥' }); HIS.audit('PAY', 'cl_charges', ch.id, `收款 ${ch.cash_due} 元`, ch.patient_id); return DB.get('cl_charges', ch.id);
};
S.clDispense = encId => {
  need('cl_disp'); const e = DB.get('encounters', encId), ch = DB.one('cl_charges', { encounter_id: encId }); if (e.disp_status !== '待領藥') err('此就診無待領藥品或已領藥'); if (ch.status !== '已批價') err('病人尚未批價，不可領藥');
  const its = DB.where('cl_items', i => i.encounter_id === encId && i.kind === 'drug' && i.disp_status === '待領藥'), pt = HIS.pt(e.patient_id), today = CL.today();
  its.forEach(i => { const m = DB.one('medications', x => x.code === i.code); const al = HIS.checkAllergy(pt.id, m); if (al.length && !i.allergy_override) err('藥師審核：' + al[0].msg); const lots = DB.where('inventory', x => x.med_code === i.code && x.qty > 0 && x.expiry >= today); if (lots.reduce((s, l) => s + l.qty, 0) < i.qty) err(`庫存不足：${i.name} 需 ${i.qty}，有效庫存 ${lots.reduce((s, l) => s + l.qty, 0)}（過期批號不可調劑）`); });
  return DB.tx(() => { its.forEach(i => { let left = i.qty; DB.where('inventory', x => x.med_code === i.code && x.qty > 0 && x.expiry >= today).sort((a, b) => a.expiry.localeCompare(b.expiry)).forEach(l => { if (left <= 0) return; const q = Math.min(l.qty, left); DB.update('inventory', l.id, { qty: l.qty - q }); DB.insert('pharmacy_dispensing', { encounter_id: encId, item_id: i.id, patient_id: pt.id, med_code: i.code, lot_no: l.lot_no, inventory_id: l.id, qty: q, type: '調劑', by: me().id, at: CL.now() }); left -= q; }); DB.update('cl_items', i.id, { disp_status: '已領藥' }); });
    DB.update('encounters', encId, { disp_status: '已領藥', dispensed_at: CL.now(), dispensed_by: me().id }); HIS.audit('DISPENSE', 'encounters', encId, `調劑 ${its.length} 項`, pt.id); });
};
S.clAddStock = (code, lot, expiry, qty, cost) => { need('cl_disp'); qty = parseInt(qty); const m = DB.one('medications', x => x.code === code); if (!m) err('藥品代碼不存在'); if (!lot || !expiry || !(qty > 0)) err('批號、效期、數量必填'); return DB.insert('inventory', { med_code: code, lot_no: lot, expiry, qty, cost: cost || m.cost, location: '藥櫃', received_at: CL.now() }); };

/* ---------- 外送檢驗回報 / 醫師閱報 ---------- */
CL.rollLabs = () => { const d = CL.today(); DB.where('cl_items', i => i.result_status === '待回報' && i.result_due <= d).forEach(i => DB.update('cl_items', i.id, { result_status: '已回報', reported_at: CL.now() })); };
S.clReviewLab = (itemId, note) => { need('cl_doctor'); const i = DB.get('cl_items', itemId); if (i.result_status !== '已回報') err('報告尚未回報'); DB.update('cl_items', itemId, { reviewed_by: me().id, reviewed_at: CL.now(), review_note: note || '', result_status: '已閱' }); HIS.audit('VIEW', 'cl_items', itemId, '醫師閱讀外送檢驗報告：' + (note || ''), i.patient_id); };

/* ---------- 日結 ---------- */
CL.dayStats = date => {
  const encs = DB.where('encounters', e => e.date === date && e.status === '完診'), ch = DB.where('cl_charges', c => c.date === date), it = DB.where('cl_items', i => i.date === date);
  const sum = (a, k) => a.reduce((s, x) => s + (x[k] || 0), 0), pv = CL.cfg().point_value, nh = ch.filter(c => c.ins === '健保');
  const drugCost = sum(it.filter(i => i.kind === 'drug'), 'cost'), svcCost = sum(it.filter(i => i.kind === 'svc'), 'cost'), cash = sum(ch.filter(c => c.status === '已批價'), 'cash_due');
  const estNhi = Math.round(sum(nh, 'claim_pt') * pv);
  return { date, visits: encs.length, nhi_visits: nh.length, self_visits: ch.length - nh.length, exam_pt: sum(nh, 'exam_pt'), drug_pt: sum(nh, 'drug_pt'), disp_pt: sum(nh, 'disp_pt'), svc_pt: sum(nh, 'svc_pt'), total_pt: sum(nh, 'total_pt'), claim_pt: sum(nh, 'claim_pt'), cash, copay_total: sum(nh, 'copay'), reg_total: sum(ch, 'reg_fee'), self_total: sum(ch, 'self_amount'), est_nhi: estNhi, drug_cost: Math.round(drugCost), svc_cost: Math.round(svcCost), gross: cash + estNhi - Math.round(drugCost + svcCost) };
};
S.clCloseDay = () => {
  need('cl_bill'); const d = CL.today(), as = DB.where('appointments', a => a.date === d && ['櫃台等候', '候診中'].includes(a.status));
  if (as.length) err(`尚有 ${as.length} 位病人未處理（櫃台等候/候診中），請完診或取消後才能日結`);
  const unp = DB.where('cl_charges', c => c.date === d && c.status === '待批價').length; if (unp) err(`尚有 ${unp} 筆費用未批價`);
  const undisp = DB.where('encounters', e => e.date === d && e.disp_status === '待領藥').length; if (undisp) err(`尚有 ${undisp} 位病人未領藥`);
  const st = CL.dayStats(d); return DB.tx(() => { DB.insert('cl_closes', Object.assign(st, { closed_at: CL.now(), closed_by: me().id })); const next = HIS.addDays(d, 1); DB.update('cl_settings', 'CFG', { biz_date: next }); CL.rollLabs();
    DB.where('cl_claims', c => c.status === '已送出' && c.review_due && c.review_due <= next).forEach(c => CL.reviewClaim(c.id)); HIS.audit('CLOSE_DAY', 'cl_closes', d, `日結 ${st.visits} 人次 現金 ${st.cash}`); return st; });
};
S.clSetting = patch => { need('*'); DB.update('cl_settings', 'CFG', patch); HIS.audit('UPDATE', 'cl_settings', 'CFG', JSON.stringify(patch)); };

/* ---------- 健保申報 ---------- */
CL.periodOf = date => date.slice(0, 4) + date.slice(5, 7);
CL.eligibleEncs = period => DB.where('encounters', e => e.ins === '健保' && e.status === '完診' && !e.claim_id && CL.periodOf(e.date) === period && (DB.one('cl_charges', { encounter_id: e.id }) || {}).status === '已批價');
S.clPeriods = () => { const m = {}; DB.where('encounters', e => e.ins === '健保' && e.status === '完診' && !e.claim_id).forEach(e => { m[CL.periodOf(e.date)] = (m[CL.periodOf(e.date)] || 0) + 1; }); return Object.keys(m).sort().map(p => ({ period: p, n: m[p] })); };
const lineFromEnc = (e, claimId) => {
  const ch = DB.one('cl_charges', { encounter_id: e.id }), v = CL.viewOfEnc(e), iss = CL.rules(v), pd = v.dx.find(d => d.type === '主要');
  return { claim_id: claimId, encounter_id: e.id, patient_id: e.patient_id, date: e.date, ic_seq: e.ic_seq, icd: pd ? pd.icd : '', exam_pt: ch.exam_pt, drug_pt: ch.drug_pt, disp_pt: ch.disp_pt, svc_pt: ch.svc_pt, total_pt: ch.total_pt, copay: ch.copay, claim_pt: ch.claim_pt, issues: iss, status: '正常', cut_pt: 0, cuts: [] };
};
const sumClaim = id => { const ls = DB.where('cl_claim_lines', l => l.claim_id === id && l.status !== '暫不申報'); const sum = k => ls.reduce((s, l) => s + (l[k] || 0), 0); return { visit_count: ls.length, total_pt: sum('total_pt'), copay: sum('copay'), points_claimed: sum('claim_pt'), points_cut: sum('cut_pt') }; };
S.clClaimCreate = period => {
  need('cl_claim'); if (!/^\d{6}$/.test(period)) err('費用年月格式錯誤'); if (DB.one('cl_claims', c => c.period === period && c.status === '草稿')) err('此費用年月已有草稿，請先處理');
  const es = CL.eligibleEncs(period); if (!es.length) err('此費用年月沒有可申報的就診（需為健保、已批價、未申報）');
  return DB.tx(() => { const c = DB.insert('cl_claims', { period, status: '草稿', created_at: CL.now(), created_by: me().id, seq: DB.where('cl_claims', x => x.period === period).length + 1 }); es.forEach(e => DB.insert('cl_claim_lines', lineFromEnc(e, c.id))); DB.update('cl_claims', c.id, sumClaim(c.id)); HIS.audit('CREATE', 'cl_claims', c.id, `建立 ${period} 申報 ${es.length} 筆`); return DB.get('cl_claims', c.id); });
};
S.clClaimRecheck = claimId => { need('cl_claim'); const c = DB.get('cl_claims', claimId); if (c.status !== '草稿') err('僅草稿可重新檢核'); DB.where('cl_claim_lines', l => l.claim_id === claimId).forEach(l => { const e = DB.get('encounters', l.encounter_id); const n = lineFromEnc(e, claimId); DB.update('cl_claim_lines', l.id, { issues: n.issues, ic_seq: n.ic_seq, icd: n.icd }); }); DB.update('cl_claims', claimId, sumClaim(claimId)); };
S.clLineExclude = (lineId, reason) => { need('cl_claim'); if (!(reason || '').trim()) err('請填寫暫不申報原因'); const l = DB.get('cl_claim_lines', lineId); DB.update('cl_claim_lines', lineId, { status: l.status === '暫不申報' ? '正常' : '暫不申報', exclude_reason: reason }); DB.update('cl_claims', l.claim_id, sumClaim(l.claim_id)); };
S.clClaimSubmit = claimId => {
  need('cl_claim'); const c = DB.get('cl_claims', claimId); if (c.status !== '草稿') err('此申報已送出'); const ls = DB.where('cl_claim_lines', l => l.claim_id === claimId && l.status === '正常'); if (!ls.length) err('沒有可送出的明細');
  const bad = ls.filter(l => l.issues.some(i => i.level === 'E')); if (bad.length) err(`尚有 ${bad.length} 筆明細有「錯誤」等級檢核問題（如缺就醫序號），請修正或標示暫不申報後再送出`);
  return DB.tx(() => { ls.forEach(l => DB.update('encounters', l.encounter_id, { claim_id: claimId })); DB.update('cl_claims', claimId, Object.assign(sumClaim(claimId), { status: '已送出', submitted_at: CL.now(), review_due: HIS.addDays(CL.today(), 3) })); HIS.audit('SUBMIT', 'cl_claims', claimId, `送出 ${c.period} 申報 ${ls.length} 筆`); });
};
CL.reviewClaim = claimId => { // 模擬審查：依檢核問題之核減機率（以明細 id 為種子，可重現）
  const c = DB.get('cl_claims', claimId); if (c.status !== '已送出') return; const pv = CL.cfg().point_value;
  DB.where('cl_claim_lines', l => l.claim_id === claimId && l.status === '正常').forEach(l => { const r = CL.rng(l.id + 'review'), cuts = [];
    l.issues.filter(i => i.level === 'W' && i.cut).forEach(i => { if (r() < i.cut.p) { const it = i.cut.type === 'exam' ? null : DB.one('cl_items', x => x.encounter_id === l.encounter_id && x.code === i.cut.code); const pt = i.cut.type === 'exam' ? Math.round(l.exam_pt * (i.cut.half ? 0.5 : 1)) : (it ? it.amount_pt : 0); if (pt > 0) cuts.push({ rule: i.code, pt, text: i.msg }); } });
    let cut = Math.min(l.claim_pt, cuts.reduce((s, x) => s + x.pt, 0)); DB.update('cl_claim_lines', l.id, { status: cut ? '核減' : '核付', cut_pt: cut, cuts }); });
  const t = sumClaim(claimId), paid = t.points_claimed - t.points_cut; DB.update('cl_claims', claimId, Object.assign(t, { status: '已核付', reviewed_at: CL.now(), points_paid: paid, amount_paid: Math.round(paid * pv) })); HIS.audit('REVIEW', 'cl_claims', claimId, `模擬審查完成 核減 ${t.points_cut} 點`);
};
S.clClaimReviewNow = claimId => { need('cl_claim'); const c = DB.get('cl_claims', claimId); if (c.status !== '已送出') err('此申報尚未送出或已審查'); DB.tx(() => CL.reviewClaim(claimId)); };
S.clAppeal = (lineId, text) => {
  need('cl_claim'); const l = DB.get('cl_claim_lines', lineId); if (l.status !== '核減') err('僅核減明細可申復'); if ((text || '').trim().length < 20) err('申復理由至少 20 字，請具體說明醫療必要性（引用病歷內容）');
  const r = CL.rng(l.id + 'appeal'), win = r() < 0.5 + Math.min(0.3, (text.trim().length - 20) / 200); const pv = CL.cfg().point_value;
  DB.tx(() => { DB.update('cl_claim_lines', lineId, { status: win ? '申復核付' : '申復駁回', appeal_text: text, appeal_result: win ? '申復成功，恢復核付' : '申復駁回，維持核減', cut_pt: win ? 0 : l.cut_pt }); const t = sumClaim(l.claim_id), paid = t.points_claimed - t.points_cut; DB.update('cl_claims', l.claim_id, Object.assign(t, { points_paid: paid, amount_paid: Math.round(paid * pv) })); HIS.audit('APPEAL', 'cl_claim_lines', lineId, win ? '申復成功' : '申復駁回'); }); return win;
};
/* 病歷修訂（診斷）：申報前更正，保留版本 */
S.clAmendDx = (encId, dx, reason) => {
  need('cl_doctor'); if (!(reason || '').trim()) err('請填寫修訂原因'); const e = DB.get('encounters', encId); if (e.claim_id) err('已送出申報，無法修改診斷'); if (dx.filter(d => d.type === '主要').length !== 1) err('必須有且僅有 1 個主要診斷');
  dx.forEach(d => { if (!DB.one('icd10', x => x.code === d.icd)) err('ICD 診斷碼不存在：' + d.icd); });
  return DB.tx(() => { DB.where('diagnoses', d => d.encounter_id === encId && d.status !== '已刪除').forEach(d => DB.update('diagnoses', d.id, { status: '已刪除' })); dx.forEach(d => { const x = DB.one('icd10', c => c.code === d.icd); DB.insert('diagnoses', { patient_id: e.patient_id, encounter_id: encId, icd_code: x.code, zh: x.zh, en: x.en, type: d.type, status: d.status || '確診', scope: '', date: e.date, doctor_id: me().id }); });
    const rec = HIS.encRecord(encId); DB.update('medical_records', rec.id, { version: rec.version + 1, updated_at: CL.now(), updated_by: me().id }); const n = DB.get('medical_records', rec.id);
    DB.insert('record_versions', Object.assign({ record_id: rec.id, patient_id: e.patient_id, version: n.version, saved_at: CL.now(), saved_by: me().id, reason: '診斷修訂：' + reason, status: '已簽署' }, Object.fromEntries(CL.REC_FIELDS.map(k => [k, n[k]])))); DB.update('encounters', encId, { primary_icd: dx.find(d => d.type === '主要').icd }); HIS.audit('AMEND', 'encounters', encId, '診斷修訂：' + reason, e.patient_id); });
};

/* ---------- 範本 ---------- */
CL.applyTpl = (t, ctx) => { const f = {}, vit = ctx.vitals ? [ctx.vitals.bp_sys && `BP ${ctx.vitals.bp_sys}/${ctx.vitals.bp_dia} mmHg`, ctx.vitals.hr && `HR ${ctx.vitals.hr}`, ctx.vitals.rr && `RR ${ctx.vitals.rr}`, ctx.vitals.temp && `BT ${ctx.vitals.temp}°C`, ctx.vitals.spo2 && `SpO₂ ${ctx.vitals.spo2}%`].filter(Boolean).join('，') : '（尚未量測）';
  CL.REC_FIELDS.forEach(k => { f[k] = String((t.f || {})[k] || '').replace(/\{\{name\}\}/g, ctx.name || '').replace(/\{\{age\}\}/g, ctx.age || '').replace(/\{\{sex\}\}/g, ctx.sex || '').replace(/\{\{vitals\}\}/g, vit); }); return f; };
CL.autofill = (txt, r) => String(txt).replace(/（([^（）/]+)\/([^（）]+)）/g, (m, a) => a).replace(/＿(?=天|週|日|個月|小時|分鐘|次|cm|mg|mcg)/g, () => String(2 + Math.floor(r() * 3))).replace(/＿/g, '').replace(/[ ]{2,}/g, ' ');
S.clTplSave = t => { need('cl_tpl'); if (!(t.name || '').trim()) err('範本名稱必填'); const row = { name: t.name.trim(), cat: t.cat || '自訂', f: t.f || {}, dx: t.dx || [], rx: t.rx || [], sv: t.sv || [], builtin: !!t.builtin, updated_at: CL.now(), updated_by: me().id };
  (row.dx || []).forEach(c => { if (!DB.one('icd10', x => x.code === c)) err('範本中的 ICD 不存在：' + c); }); (row.rx || []).forEach(x => { const [ing, , ,] = x.split('|'); if (!CL.drugBy(ing)) err('範本中的藥品不存在：' + ing); }); (row.sv || []).forEach(c => { if (!DB.one('cl_services', s => s.code === c)) err('範本中的項目不存在：' + c); });
  if (t.id) { DB.update('templates', t.id, row); HIS.audit('UPDATE', 'templates', t.id, row.name); return DB.get('templates', t.id); } const n = DB.insert('templates', Object.assign(row, { key: 'U' + Date.now().toString(36), created_by: me().id })); HIS.audit('CREATE', 'templates', n.id, row.name); return n; };

UI.radImg = (mod, code) => {

  let body = '';
  if (code === 'CXR') body = ell(80, 110, 38, 62, .35) + ell(160, 110, 38, 62, .35) + '<rect x="115" y="30" width="10" height="150" fill="#ddd" opacity=".5"/>' + ell(130, 130, 28, 32, .45);
  else if (mod === 'CT' || mod === 'MRI') body = '<circle cx="120" cy="105" r="75" fill="none" stroke="#ccc" stroke-width="5"/>' + ell(120, 105, 62, 55, .25) + ell(100, 100, 18, 26, .4) + ell(142, 100, 18, 26, .4);
  else if (mod === 'Ultrasound') body = '<path d="M120 10 L20 190 L220 190 Z" fill="#555" opacity=".7"/>' + ell(110, 110, 30, 20, .35) + ell(150, 130, 20, 14, .25);
  else body = '<rect x="95" y="20" width="50" height="160" rx="12" fill="#ddd" opacity=".4"/>' + ell(120, 60, 22, 14, .5) + ell(120, 100, 22, 14, .5) + ell(120, 140, 22, 14, .5);
  return `<svg viewBox="0 0 240 200" width="240" height="200" style="background:#111;border:1px solid #444">${body}<text x="6" y="14" fill="#9c9" font-size="10">${E(mod)} 示意圖（虛構，非真實影像）</text></svg>`;
};

UI.openLabWork = oid => { const o0 = DB.get('lab_orders', oid); UI.win('lw:' + oid, { title: `檢驗作業 ${P(o0.patient_id).name} ${o0.panel_name}`, w: 900, h: 580, render: w => {

  const ST = HIS.ST, existing = {}; DB.where('lab_results', r => r.lab_order_id === oid).forEach(r => { existing[r.analyte] = r; });
  const pubd = o.report_status === '已發布', canEnter = o.status === ST.RUN && !pubd;

  } else {
    h += sp ? `<div class="hd">檢體</div>${kv([['條碼', E(sp.barcode)], ['種類', E(sp.type)], ['採檢時間', fdt(sp.collected_at)], ['收件時間', fdt(sp.received_at)], ['收件人員', E(HIS.staffName(sp.received_by))], ['', '']], 3)}` : '';
    h += `<div class="hd">檢驗結果輸入（參考區間依性別預設，可修改；異常自動標示）</div><table class="grid"><thead><tr><th>項目</th><th>結果</th><th>單位</th><th>參考下限</th><th>參考上限</th><th>標示</th></tr></thead><tbody>` + panel.analytes.map(ac => {
      const a = DB.one('lab_items', x => x.code === ac), r = existing[ac], ref = HIS.refFor(a, p), lo = r ? r.ref_lo : ref.lo, hi = r ? r.ref_hi : ref.hi;
      const inp = a.type === 'q' ? `<select name="v_${ac}" data-chg="calc" data-a="${ac}" ${canEnter ? '' : 'disabled'}><option value=""></option>${[a.normal, a.abn].map(x => `<option ${r && r.value === x ? 'selected' : ''}>${E(x)}</option>`).join('')}</select>` : `<input name="v_${ac}" data-inp="calc" data-a="${ac}" size="8" value="${E(r ? r.value : '')}" ${canEnter ? '' : 'disabled'}>`;
      return `<tr id="row_${ac}"><td>${E(a.name)}</td><td>${inp}</td><td>${E(a.unit)}</td><td>${a.type === 'q' ? E(a.normal) : `<input name="lo_${ac}" data-inp="calc" data-a="${ac}" size="6" value="${lo ?? ''}" ${canEnter ? '' : 'disabled'}>`}</td><td>${a.type === 'q' ? '' : `<input name="hi_${ac}" data-inp="calc" data-a="${ac}" size="6" value="${hi ?? ''}" ${canEnter ? '' : 'disabled'}>`}</td><td id="fl_${ac}">${r ? flag(r.flag) || '正常' : ''}</td></tr>`;

  w.body.innerHTML = `<div class="pad"><table class="kv"><tr><th>姓名*</th><td><input name="name"></td><th>性別*</th><td><select name="sex">${opts([['M', '男'], ['F', '女']])}</select></td></tr><tr><th>出生日期*</th><td><input type="date" name="birth"></td><th>身分證字號*（虛構）</th><td><input name="id_no"></td></tr><tr><th>手機</th><td><input name="phone"></td><th>血型</th><td><select name="blood">${opts(['未檢驗', 'A型 Rh+', 'B型 Rh+', 'O型 Rh+', 'AB型 Rh+', 'A型 Rh-', 'B型 Rh-', 'O型 Rh-', 'AB型 Rh-'])}</select></td></tr><tr><th>地址</th><td colspan="3"><input name="address" size="50"></td></tr><tr><th>緊急聯絡人</th><td><input name="emergency_name"></td><th>關係/電話</th><td><input name="emergency_rel" size="6"><input name="emergency_phone" size="12"></td></tr><tr><th>身高/體重</th><td><input name="height" size="4">cm <input name="weight" size="4">kg</td><th>保險身分</th><td><select name="ins_type">${opts(['健保', '自費', '榮民'])}</select></td></tr></table><div class="bar">${btn('save', '建立病歷號', { cls: 'pri' })}</div></div>`;

UI.openRegister = () => UI.win('register', { title: '掛號作業', w: 900, h: 480, state: { q: '', sel: null }, render: w => {
  const s = w.state, q = s.q.trim(), rs = q ? DB.where('patients', p => p.chart_no.includes(q) || p.name.includes(q) || p.id_no.includes(q.toUpperCase())).slice(0, 12) : [];
  const docs = DB.where('users', u => ['R-attending', 'R-resident'].includes(u.role_id) && u.dept_id !== 'DEP-ER'), sel = s.sel ? P(s.sel) : null;
  w.body.innerHTML = `<div class="pad"><div class="bar">病人搜尋（病歷號/姓名/身分證）：<input name="q" value="${E(s.q)}" size="16">${btn('find', '搜尋')}${btn('np', '新病人建檔')}</div>${rs.length ? table([['病歷號', p => E(p.chart_no)], ['姓名', p => E(p.name)], ['性別/年齡', p => sexAge(p)], ['身分證', p => HIS.maskId(p.id_no)], ['', p => btn('sel', '選取', { id: p.id })]], rs) : q ? '<div class="empty">查無病人，請先新病人建檔</div>' : ''}
  <div class="hd">掛號資料　${sel ? UI.patLine(sel) : '<span class="bad">尚未選取病人</span>'}</div><table class="kv"><tr><th>看診醫師</th><td><select name="doc">${opts(docs.map(d => [d.id, `${HIS.deptName(d.dept_id)} ${d.name}（${d.title}）`]))}</select></td><th>日期</th><td><input type="date" name="date" value="${HIS.today()}" min="${HIS.today()}"></td><th>診次</th><td><select name="session">${opts(['上午', '下午', '晚上'])}</select></td><td>${btn('reg', '掛號', { cls: 'pri', dis: !sel })}</td></tr></table></div>`;
  w.act.find = () => { s.q = $('[name=q]', w.body).value; UI.refresh(w); }; $('[name=q]', w.body).onkeydown = e => { if (e.key === 'Enter') w.act.find(); }; w.act.np = () => UI.openNewPatient();
  w.act.sel = el => { s.q = $('[name=q]', w.body).value; s.sel = el.dataset.id; UI.refresh(w); };
  w.act.reg = () => { const v = UI.vals(w), a = S.register({ patient_id: s.sel, doctor_id: v.doc, date: v.date, session: v.session }); UI.alert(`掛號成功：${P(s.sel).name}　${HIS.staffName(v.doc)}　${v.date} ${v.session}　${a.queue_no} 號`); };
} });

UI.openBeds = () => UI.win('beds', { title: '病床管理', w: 980, h: 560, live: true, render: w => {
  const canSet = HIS.can('bed');
  w.body.innerHTML = `<div class="scrollbox" style="height:100%"><div class="legend">${['空床', '使用中', '清潔中', '保留床', '維修中'].map(x => st(x)).join(' ')}　${canSet ? '點選床位可變更狀態' : ''}</div>` + DB.all('wards').map(wd => {
    const bs = DB.where('beds', b => b.ward_id === wd.id), cnt = x => bs.filter(b => b.status === x).length;
    return `<div class="hd">${E(wd.name)}　${E(HIS.deptName(wd.dept_id))}　使用 ${cnt('使用中')}／${bs.length}　空床 ${cnt('空床')}</div><div class="bedrow">${bs.map(b => { const a = HIS.bedAdm(b.id), p = a ? P(a.patient_id) : null; return `<div class="bed b-${{ 空床: 'green', 使用中: 'red', 清潔中: 'orange', 保留床: 'blue', 維修中: 'gray' }[b.status]}" data-act="bed" data-id="${b.id}"><b>${E(b.id)}</b><br>${b.status}${p ? `<br>${E(p.name)}<br>${sexAge(p)}` : ''}</div>`; }).join('')}</div>`;
  }).join('') + '</div>';
  w.act.bed = el => { const b = DB.get('beds', el.dataset.id), a = HIS.bedAdm(b.id); if (a) { UI.dialog(`床位 ${b.id}`, `<div class="dmsg">${UI.patLine(P(a.patient_id))}<br>入院診斷：${E(a.admit_dx)}<br>主治：${E(HIS.staffName(a.attending_id))}　入院：${fdt(a.admit_time)}</div>`, [{ t: '開啟病人資料', primary: true, cb: () => UI.openPatient(a.patient_id) }, { t: '開啟病歷', cb: () => UI.openWorkspace(a.encounter_id) }, { t: '關閉' }]); return; }

} });
UI.openAdmReq = () => UI.win('admreq', { title: '入院申請 / 床位分配', w: 1100, h: 480, live: true, render: w => {
  const rq = DB.where('admissions', a => a.status === '入院申請').sort((a, b) => a.requested_at.localeCompare(b.requested_at)), free = DB.where('beds', b => b.status === '空床');

  const cand = s.q ? DB.where('patients', p => p.chart_no.includes(s.q) || p.name.includes(s.q) || p.id_no.includes(s.q.toUpperCase())).slice(0, 25) : [];
  w.body.innerHTML = `${canReg ? `<div class="hd">急診掛號 / 檢傷分類</div><table class="kv"><tr><th>病人</th><td><input data-inp="q" name="q" size="12" value="${E(s.q)}" placeholder="病歷號/姓名"> <select name="pid" style="width:190px">${opts(cand.map(p => [p.id, `${p.chart_no} ${p.name} ${sexAge(p)}`]), s.sel)}</select></td><th>檢傷級數</th><td><select name="tri">${opts(Object.entries(HIS.TRIAGE), 3)}</select></td><th>主訴</th><td><input name="cc" size="22"></td><th>BP</th><td><input name="bp_sys" size="3">/<input name="bp_dia" size="3"> HR<input name="hr" size="3"> T<input name="temp" size="4"> SpO₂<input name="spo2" size="3"></td><td>${btn('reg', '掛號並檢傷', { cls: 'pri' })}</td></tr></table>` : ''}
  <div class="hd">急診看板（${l.length}）</div><div class="scrollbox" style="height:calc(100% - ${canReg ? 100 : 30}px)">${table([['級', e => UI.triBadge(e.triage_level)], ['病歷號', e => E(P(e.patient_id).chart_no)], ['病人', e => pl(e.patient_id)], ['性別/年齡', e => sexAge(P(e.patient_id))], ['過敏', e => HIS.allergies(e.patient_id).length ? '<b class="bad">⚠</b>' : ''], ['主訴', e => E(e.triage_cc)], ['到院', e => e.start_time.slice(11, 16)], ['等候(分)', e => Math.round((now - new Date(e.start_time.replace(' ', 'T'))) / 60000), 'num'], ['狀態', e => st(e.er_status)], ['醫師', e => E(HIS.staffName(e.doctor_id) || '—')], ['', e => (e.er_status === '候診' && HIS.can('opd') ? btn('take', '接診', { id: e.id, cls: 'pri' }) : '') + btn('ws', '開啟', { id: e.id })]], l, { empty: '目前沒有急診病人', dbl: 'wsd' })}</div>`;
  w.inp.q = el => { s.q = el.value; const c = el.value ? DB.where('patients', p => p.chart_no.includes(el.value) || p.name.includes(el.value) || p.id_no.includes(el.value.toUpperCase())).slice(0, 25) : []; $('[name=pid]', w.body).innerHTML = opts(c.map(p => [p.id, `${p.chart_no} ${p.name} ${sexAge(p)}`])); };
  w.act.pt = el => UI.openPatient(el.dataset.id); w.act.ws = el => UI.openWorkspace(el.dataset.id); w.act.take = el => { S.erTake(el.dataset.id); UI.openWorkspace(el.dataset.id); };
  w.act.reg = () => { const v = UI.vals(w); const e = S.erRegister({ patient_id: v.pid, triage: v.tri, cc: v.cc, vitals: { bp_sys: v.bp_sys, bp_dia: v.bp_dia, hr: v.hr, temp: v.temp, spo2: v.spo2 } }); s.q = ''; s.sel = ''; UI.status('急診掛號完成：' + HIS.TRIAGE[v.tri]); UI.refresh(w); };
} });

/* ================= 系統管理 ================= */
UI.openAudit = () => UI.win('audit', { title: '操作紀錄 Audit Log', w: 1150, h: 540, live: true, state: { f: {} }, render: w => {
  const f = w.state.f; let l = DB.all('audit_logs'); const has = (a, b) => String(a || '').toLowerCase().includes(String(b).toLowerCase());
  if (f.user) l = l.filter(x => has(x.emp_no + x.user_name, f.user)); if (f.action) l = l.filter(x => x.action === f.action); if (f.chart) { const ids = DB.where('patients', p => p.chart_no.includes(f.chart) || p.name.includes(f.chart)).map(p => p.id); l = l.filter(x => ids.includes(x.patient_id)); } if (f.date) l = l.filter(x => x.at.startsWith(f.date)); if (f.tbl) l = l.filter(x => x.table_name === f.tbl);
  const actions = [...new Set(DB.all('audit_logs').map(x => x.action))].sort();
  w.body.innerHTML = `<div class="bar">使用者<input name="user" size="8" value="${E(f.user || '')}"> 動作<select name="action">${opts(actions, f.action, '全部')}</select> 資料表<select name="tbl">${opts(DB.tables, f.tbl, '全部')}</select> 病人<input name="chart" size="8" value="${E(f.chart || '')}"> 日期<input type="date" name="date" value="${E(f.date || '')}"> ${btn('go', '篩選', { cls: 'pri' })}${btn('clr', '清除')}　符合 ${l.length} / 共 ${DB.all('audit_logs').length} 筆（僅顯示最新 300 筆）</div><div class="scrollbox" style="height:calc(100% - 30px)">${table([['時間', x => x.at], ['員編', x => E(x.emp_no)], ['姓名', x => E(x.user_name)], ['角色', x => E(x.role)], ['工作站', x => E(x.ws)], ['動作', x => `<b>${E(x.action)}</b>`], ['資料表', x => E(x.table_name)], ['記錄ID', x => E(x.record_id)], ['病人', x => x.patient_id ? E(P(x.patient_id).name) : ''], ['說明', x => E(x.detail)]], l.slice().reverse().slice(0, 300), { rowCls: x => /FAIL|CRITICAL|AMEND|REJECT/.test(x.action) ? 'abn' : '' })}</div>`;
  w.act.go = () => { w.state.f = UI.vals(w); UI.refresh(w); }; w.act.clr = () => { w.state.f = {}; UI.refresh(w); };
} });

  w.body.innerHTML = `<div class="bar">${kv([['費用年月', c.period], ['狀態', stc(c.status, CS)], ['件數', c.visit_count], ['申請點數', c.points_claimed], ['核減點數', c.points_cut || 0], ['核付', c.status === '已核付' ? NT(c.amount_paid) + '（' + c.points_paid + ' 點）' : '-']], 6)}</div>
  <div class="bar">${draft ? btn('re', '重新檢核') + ' ' + btn('sub', '送出申報', { cls: 'pri' }) + (errs ? `　<span class="bad">尚有 ${errs} 筆錯誤等級問題</span>` : '') : ''}${c.status === '已送出' ? btn('rev', '立即模擬審查', { cls: 'pri' }) + ` <span class="muted">（預計 ${E(c.review_due || '')} 後日結時自動審查）</span>` : ''}　顯示：<select data-chg="f">${opts([['all', '全部'], ['iss', '有檢核問題'], ['正常', '正常'], ['暫不申報', '暫不申報'], ['核減', '核減'], ['申復核付', '申復核付'], ['申復駁回', '申復駁回']], f)}</select></div>
  <div class="scrollbox" style="height:calc(100% - 96px)">${table([['就診日', l => l.date], ['病人', l => E(HIS.pt(l.patient_id).name)], ['主診斷', l => E(l.icd)], ['診察', l => l.exam_pt, 'num'], ['藥費', l => l.drug_pt, 'num'], ['藥事', l => l.disp_pt, 'num'], ['處置', l => l.svc_pt, 'num'], ['申請', l => l.claim_pt, 'num'], ['檢核', l => issueHtml(l)], ['狀態', l => stc(l.status, LS) + (l.cut_pt ? ` <b class="bad">-${l.cut_pt}</b>` : '')], ['', l => btn('view', '詳', { id: l.id }) + (draft ? ' ' + btn('ex', l.status === '暫不申報' ? '恢復' : '暫不申報', { id: l.id }) : '') + (l.status === '核減' ? ' ' + btn('ap', '申復', { id: l.id }) : '')]], ls.slice(0, 400), { empty: '無明細' })}${ls.length > 400 ? '<div class="muted">僅顯示前 400 筆，請用篩選縮小範圍</div>' : ''}</div>`;
  w.chg.f = el => { w.state.f = el.value; }; w.act.re = () => { S.clClaimRecheck(id); UI.status('已重新檢核'); }; w.act.sub = () => UI.confirm('送出後不可再修改明細。確定送出？', () => { S.clClaimSubmit(id); UI.status('申報已送出'); }); w.act.rev = () => { S.clClaimReviewNow(id); UI.status('審查完成'); };
  w.act.ex = el => { const l = DB.get('cl_claim_lines', el.dataset.id); UI.ask(l.status === '暫不申報' ? '恢復申報' : '暫不申報', '請填寫原因（如：待補卡、診斷待確認）', v => S.clLineExclude(l.id, v)); };
  w.act.view = el => { const l = DB.get('cl_claim_lines', el.dataset.id), e = DB.get('encounters', l.encounter_id); UI.dialog('明細：' + HIS.pt(l.patient_id).name + ' ' + l.date, `<div style="min-width:560px">${(l.issues || []).map(i => `<div class="al al-${i.level}"><b>${E(i.code)}</b> ${E(i.msg)}</div>`).join('') || '<div class="muted">無檢核問題</div>'}${(l.cuts || []).map(x => `<div class="al al-E"><b>核減 ${x.pt} 點</b> ${E(x.text)}</div>`).join('')}${l.appeal_text ? `<div class="hd">申復</div><div>${E(l.appeal_text)}</div><b>${E(l.appeal_result)}</b>` : ''}${UI.chargeDetail(e.id)}</div>`, [{ t: '看病歷', cb: () => { UI.clRecordDialog(e.id); return false; } }, { t: '關閉', primary: true }]); };
  w.act.ap = el => UI.ask('申復', '請具體說明醫療必要性並引用病歷內容（至少 20 字；越具體成功率越高）', v => { const ok = S.clAppeal(el.dataset.id, v); UI.alert(ok ? '申復成功，恢復核付。' : '申復被駁回，維持核減。', '申復結果'); }, { rows: 5 });
} });

/* ---------- 範本管理 ---------- */
const FN = CL.FIELD_LABEL;
UI.openClTpl = () => UI.win('cl-tpl', { title: '範本管理（SOAP／處方／檢驗）', w: 940, h: 580, live: true, state: { q: '' }, render: w => {
  const q = (w.state.q || '').toLowerCase(), L = DB.where('templates', t => !t.deleted && (!q || (t.name + t.cat).toLowerCase().includes(q))).sort((a, b) => (a.cat || '').localeCompare(b.cat || '', 'zh-Hant'));
  w.body.innerHTML = `<div class="bar">搜尋 <input data-inp="q" value="${E(w.state.q)}" size="12">　${btn('new', '＋ 新增範本', { cls: 'pri' })} ${btn('restore', '還原內建範本')} ${btn('imp', '匯入 JSON')} ${btn('exp', '匯出 JSON')}　<span class="muted">共 ${L.length} 個；範本內「＿」「（有/無）」為完診前必須填的標記，{{name}} {{age}} {{sex}} {{vitals}} 會自動代入</span></div><div class="scrollbox" style="height:calc(100% - 34px)">${table([['分類', t => E(t.cat)], ['名稱', t => `<b>${E(t.name)}</b>`], ['診斷', t => E((t.dx || []).join(','))], ['處方', t => (t.rx || []).length], ['檢驗', t => (t.sv || []).length], ['來源', t => t.builtin ? '內建' : '自訂'], ['', t => btn('edit', '編輯', { id: t.id }) + ' ' + btn('dup', '複製', { id: t.id }) + ' ' + btn('del', '刪除', { id: t.id })]], L, { dbl: 'edit', empty: '無範本' })}</div>`;
  w.inp.q = el => { w.state.q = el.value; UI.refresh(w); const i = $('[data-inp=q]', w.body); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } };
  const form = t => UI.dialog(t.id ? '編輯範本' : '新增範本', `<div class="scrollbox" style="max-height:65vh;min-width:680px"><table class="kv"><tr><th>名稱</th><td><input name="name" value="${E(t.name || '')}" size="30"></td><th>分類</th><td><input name="cat" value="${E(t.cat || '自訂')}" size="12"></td></tr></table>
    ${CL.REC_FIELDS.map(k => `<div class="fld"><label>${E(FN[k])}</label><textarea name="f_${k}" rows="${['hpi', 'pe', 'plan'].includes(k) ? 3 : 2}">${E((t.f || {})[k] || '')}</textarea></div>`).join('')}
    <div class="fld"><label>建議診斷（ICD，逗號分隔，第一個為主要）</label><input name="dx" value="${E((t.dx || []).join(','))}" size="60"></div>
    <div class="fld"><label>建議處方（每行：成分|單次劑量|頻率|天數，例：Amlodipine|1|QD|28）</label><textarea name="rx" rows="4">${E((t.rx || []).join('\n'))}</textarea></div>
    <div class="fld"><label>建議檢驗／處置（代碼，逗號分隔）</label><input name="sv" value="${E((t.sv || []).join(','))}" size="60"></div><div class="dlgerr bad"></div></div>`,
    [{ t: '儲存', primary: true, cb: m => { const g = n => $(`[name=${n}]`, m).value, f = {}; CL.REC_FIELDS.forEach(k => { f[k] = g('f_' + k); }); const sp = s => s.split(/[,，\s]+/).map(x => x.trim()).filter(Boolean);
      S.clTplSave({ id: t.id, name: g('name'), cat: g('cat'), f, dx: sp(g('dx')), rx: g('rx').split('\n').map(x => x.trim()).filter(Boolean), sv: sp(g('sv')), builtin: t.builtin && !!t.id }); UI.status('範本已儲存'); } }, { t: '取消' }]);
  w.act.new = () => form({}); w.act.edit = el => form(DB.get('templates', el.dataset.id)); w.dbl.edit = tr => form(DB.get('templates', tr.dataset.id));
  w.act.dup = el => { const t = DB.get('templates', el.dataset.id); form({ name: t.name + '（複本）', cat: t.cat, f: t.f, dx: t.dx, rx: t.rx, sv: t.sv }); };
  w.act.del = el => UI.confirm('刪除此範本？（內建範本可用「還原內建範本」找回）', () => S.clTplDelete(el.dataset.id));
  w.act.restore = () => { const n = S.clTplRestore(); UI.alert('已還原／補回 ' + n + ' 個內建範本。'); };
  w.act.exp = () => UI.dialog('匯出範本 JSON', `<textarea class="dta" rows="16" cols="80" readonly>${E(S.clTplExport())}</textarea><div class="note">全選複製後存檔；可在其他診所匯入。</div>`, [{ t: '關閉', primary: true }]);
  w.act.imp = () => UI.dialog('匯入範本 JSON', '<textarea class="dta" name="j" rows="14" cols="80" placeholder="貼上匯出的 JSON 陣列"></textarea><div class="dlgerr bad"></div>', [{ t: '匯入', primary: true, cb: m => { const n = S.clTplImport($('[name=j]', m).value); UI.status('已匯入 ' + n + ' 個範本'); } }, { t: '取消' }]);
} });

  w.inp.q = el => { w.state.q = el.value; UI.refresh(w); const i = $('[data-inp=q]', w.body); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } };
  const op = id => { const p = HIS.pt(id), es = DB.where('encounters', e => e.patient_id === id).sort((a, b) => b.end_time.localeCompare(a.end_time)); UI.dialog('就診紀錄：' + p.name, `<div style="min-width:620px"><div>${UI.patLine(p)}</div>${table([['日期', e => e.date], ['醫師', e => E(HIS.staffName(e.doctor_id))], ['診斷', e => E(DB.where('diagnoses', d => d.encounter_id === e.id && d.status !== '已刪除').map(d => d.zh).join('、'))], ['身分', e => e.ins], ['', e => btn('r', '病歷', { id: e.id })]], es, { empty: '尚無就診' })}</div>`, [{ t: '關閉', primary: true }]);
    $$('.modal [data-act=r]').forEach(b => { b.onclick = () => UI.clRecordDialog(b.dataset.id); }); };
  w.act.open = el => op(el.dataset.id); w.dbl.open = tr => op(tr.dataset.id);

/* ---------- 設定／一致性 ---------- */
UI.openClSettings = () => UI.win('cl-set', { title: '診所設定／資料一致性檢查', w: 860, h: 600, live: true, render: w => {
  const c = CL.cfg(), admin = HIS.can('*'), R = S.clConsistency();
  const inp = (n, v, sz) => `<input name="${n}" value="${E(v)}" size="${sz || 8}" ${admin ? '' : 'disabled'}>`, js = x => JSON.stringify(x);
  w.body.innerHTML = `<div class="scrollbox" style="height:100%"><div class="hd">費用參數（虛構／教學簡化；僅院長可修改）</div>${kv([['診所名稱', inp('clinic_name', c.clinic_name, 16)], ['每點金額（元）', inp('point_value', c.point_value)], ['掛號費', inp('reg_fee', c.reg_fee)], ['門診部分負擔', inp('copay_visit', c.copay_visit)], ['自費診察費', inp('self_exam', c.self_exam)], ['來客間隔（秒）', inp('arrive_sec', c.arrive_sec)], ['候位上限', inp('max_wait', c.max_wait || 6)]], 4)}
  ${kv([['診察費分級 [[人次上限,點數],…]', inp('exam_tiers', js(c.exam_tiers), 40)], ['藥事服務費 [[天數上限,點數],…]', inp('disp_tiers', js(c.disp_tiers), 40)], ['藥品部分負擔 [[藥費點數上限,金額],…]', inp('drug_copay', js(c.drug_copay), 60)]], 1)}
  ${admin ? `<div class="bar">${btn('save', '儲存設定', { cls: 'pri' })}　${btn('reset', '重設全部資料（重新產生虛構資料）')}</div>` : ''}
  <div class="hd">資料一致性檢查</div>${table([['檢查項目', r => E(r.name)], ['結果', r => r.ok ? '<b class="ok">通過</b>' : `<b class="bad">異常 ${r.n}</b>`], ['問題 ID（前幾筆）', r => E(r.bad.slice(0, 4).join(', '))]], R)}
  <div class="hd">關於</div><div class="note">${E(HIS.VERSION)}。全部人物、院所、藥品、健保碼與規則皆為虛構／簡化，僅供教育及娛樂，與真實健保署規範無關。區網同步：${HIS.remote.active ? '已連線（' + E(HIS.remote.status) + '）' : '未連線（單機）'}。</div></div>`;
  w.act.save = () => { const v = UI.vals(w), n = k => Number(v[k]), p = {}; if (v.clinic_name) p.clinic_name = v.clinic_name; ['point_value', 'reg_fee', 'copay_visit', 'self_exam', 'arrive_sec', 'max_wait'].forEach(k => { if (!(n(k) >= 0)) throw new Error('數值格式錯誤：' + k); p[k] = n(k); }); ['exam_tiers', 'disp_tiers', 'drug_copay'].forEach(k => { let a; try { a = JSON.parse(v[k]); } catch (e) { throw new Error('分級格式錯誤：' + k); } if (!Array.isArray(a) || !a.length || a.some(x => !Array.isArray(x) || x.length !== 2 || isNaN(x[0]) || isNaN(x[1]))) throw new Error('分級格式錯誤：' + k); p[k] = a; }); S.clSetting(p); UI.status('設定已儲存'); };
  w.act.reset = () => UI.confirm('這會清除所有資料（含你的操作）並重新產生虛構資料；若為區網同步模式，所有連線裝置的資料都會被重設。確定？', async () => { UI.closeAll(); HIS.session = null; if (HIS.remote.active) { await HIS.remote.resetServer(); } else { CL.seed(); } location.reload(); });
} });
